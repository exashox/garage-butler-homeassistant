# GitHub release for every version tag – HACS offers releases as updates and shows
# their version. The tags come from tool/release.sh via the Gitea push mirror;
# notes are the version's section of CHANGELOG.md. No secrets: uses the job's token.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    # Only on GitHub – Gitea Actions would pick up this file as well.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check version and collect notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          grep -q "\"version\": \"$version\"" custom_components/garagebutler/manifest.json
          awk -v h="## [$version]" 'index($0, h) == 1 {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
