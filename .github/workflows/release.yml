# GitHub release for the current version – HACS offers releases as updates and shows
# their version. Tags come from tool/release.sh via the Gitea push mirror; notes are
# the version's section of CHANGELOG.md. No secrets: uses the job's token.
#
# Mirror pushes do not always raise push events, so besides tags and main the job
# also runs daily and by hand ("Run workflow"); it only creates what is missing.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Tag and main arrive in one mirror push – run one after the other, the second finds the release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only on GitHub – Gitea Actions would pick up this file as well.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Check version and collect notes
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          grep -q "\"version\": \"$version\"" custom_components/garagebutler/manifest.json
          awk -v h="## [$version]" 'index($0, h) == 1 {f=1; next} /^## \[/{f=0} f' CHANGELOG.md > notes.md
          grep -q '[^[:space:]]' notes.md
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag exists"
          elif ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag not on GitHub yet – next run"
          else
            gh release create "$tag" --verify-tag --title "$VERSION" --notes-file notes.md
          fi
