blueprint:
  name: GarageButler – take over the mileage from the car
  description: >
    Sends the odometer of a car integration (VW, BMW, Tesla, OBD, …) to
    GarageButler once the car has stood still for a while, so mileage-based
    due dates stay correct without typing.
  domain: automation
  source_url: https://git.exalabs.de/nero/garage-butler-homeassistant/raw/branch/main/blueprints/automation/garagebutler/mileage_from_car.yaml
  input:
    odometer:
      name: Odometer
      description: Distance sensor of the car integration (km or mi).
      selector:
        entity:
          filter:
            domain: sensor
            device_class: distance
    vehicle:
      name: GarageButler vehicle
      selector:
        device:
          filter:
            integration: garagebutler
    settle:
      name: Wait before sending
      description: Only the last value after this quiet time is sent (one call per trip instead of one per kilometre).
      default:
        minutes: 10
      selector:
        duration:

mode: restart

triggers:
  - trigger: state
    entity_id: !input odometer

conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state | is_number }}"

actions:
  - delay: !input settle
  - action: garagebutler.update_mileage
    data:
      device_id: !input vehicle
      mileage: >
        {% set value = trigger.to_state.state | float %}
        {% set miles = trigger.to_state.attributes.unit_of_measurement == 'mi' %}
        {{ (value * 1.609344 if miles else value) | round(0) | int }}
